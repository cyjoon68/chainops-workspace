services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: chainops
      POSTGRES_USER: chainops
      POSTGRES_PASSWORD: chainops
    ports:
      - "5434:5432"
  elasticsearch:
    image: elasticsearch:9.2.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
  kibana:
    image: kibana:9.2.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  be:
    build: ./chainops-be
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/chainops
      DATABASE_USERNAME: chainops
      DATABASE_PASSWORD: chainops
      FLYWAY_ENABLED: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8082:8080"
    depends_on:
      - db
      - elasticsearch
  datadog:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:-00000000000000000000000000000000}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_LOGS_ENABLED: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    profiles:
      - observability
  fe:
    build: ./chainops-fe
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8082/api
    ports:
      - "3002:3000"
    depends_on:
      - be
