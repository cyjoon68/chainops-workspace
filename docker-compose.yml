services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: chainops
      POSTGRES_USER: chainops
      POSTGRES_PASSWORD: chainops
    ports:
      - "5434:5432"
  elasticsearch:
    image: elasticsearch:9.2.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
  kibana:
    image: kibana:9.2.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  be:
    build: ./chainops-be
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/chainops
      DATABASE_USERNAME: chainops
      DATABASE_PASSWORD: chainops
      FLYWAY_ENABLED: "true"
    ports:
      - "8082:8080"
    depends_on:
      - db
      - elasticsearch
  fe:
    build: ./chainops-fe
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8082/api
    ports:
      - "3002:3000"
    depends_on:
      - be
