apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainops-be
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: chainops-be
  template:
    metadata:
      annotations:
        ad.datadoghq.com/api.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8080/actuator/prometheus",
                  "namespace": "chainops",
                  "metrics": [".*"]
                }
              ]
            }
          }
      labels:
        app: chainops-be
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports:
            - containerPort: 8080
          env:
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: chainops-observability
                  key: sentry-dsn
                  optional: true
